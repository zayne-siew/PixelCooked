[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PixelCooked"
version = "0.1.0"
description = "A Tkinter recreation of Overcooked built with the Python standard library."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["black", "mypy", "pylint"]

[project.scripts]
PixelCooked = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.black]
line-length = 88
target-version = ["py312", "py313", "py314"]

[tool.mypy]
python_version = "3.12"
files = ["main.py"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.12"
ignore = [".venvs"]

[tool.pylint.format]
max-line-length = 88
